<!DOCTYPE html>
<html lang="es-CO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--SEO Tags-->
    <meta name="author" content="Carlos Andres Castro Jaramillo">
    <meta name="description" content="Diseño en Bootstrap 5">
    <meta name="keywords" content="diseño, DISEÑO, Diseño, bootstrap, Bootstrap, BOOTSTRAP">
    <!--Tags Optimized-->
    <meta name="theme-color" content="#0d6efd">
    <meta name="MobileOptimized" content="width">
    <meta name="HandhledFriendly" content="true">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar" content="black-traslucent">
    <!--Title and Favicon-->
    <title>Fray Julio</title>
    <link rel="shortcut icon" href="../assets/media/logo.png" type="image/x-icon">
    <!--Styles Bootstrap-->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <!--Icons Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="bi bi-android2"></i></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar" aria-label="Boton toggle">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="./">Forms</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="table.html">Table</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="introjs.html">Intro JS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Qué es</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <button type="button" class="btn btn-outline-primary" onclick="location.href='../'">Volver
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container pt-5 mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center">
                            <i class="bi bi-person-vcard" style="font-size: 60px;"></i>
                            <h1 class="display-6">Registro de Usuario</h1>
                        </div>
                        <form action="" method="post" enctype="application/x-www-form-urlencoded">
                            <div class="mb-3 mt-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input class="form-control" type="text" name="nombres" id="nombres"
                                    placeholder="Escriba sus nombres" required>
                            </div>
                            <div class="mb-3 mt-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input class="form-control" type="text" name="apellidos" id="apellidos"
                                    placeholder="Escriba sus apellidos" required>
                            </div>
                            <div class="mb-3 mt-3">
                                <label for="email" class="form-label">Correo</label>
                                <input class="form-control" type="email" name="email" id="email"
                                    placeholder="Escriba su correo" required>
                            </div>
                            <div class="mb-3 mt-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input class="form-control" type="password" name="password1" id="password1"
                                    placeholder="Escriba su contraseña" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-block"
                                    name="regadmin">Registrar</button>
                            </div>
                        </form>


                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center">
                            <i class="bi bi-person-bounding-box" style="font-size: 60px;"></i>
                            <h1 class="display-6">Inicio de Sesión</h1>
                        </div>
                        <form action="" method="post">
                            <div class="mb-3 mt-3">
                                <label for="email" class="form-label">Correo:</label>
                                <input type="email" class="form-control" id="email" placeholder="Ingrese su correo"
                                    name="email">
                            </div>
                            <div class="mb-3">
                                <label for="pwd" class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" id="pwd" placeholder="Ingrese su contraseña"
                                    name="pswd">
                            </div>
                            <div class="form-check mb-3">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" name="remember"> Recuerdame
                                </label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-outline-success btn-bloc">Ingresar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="my-5 py-4 text-center"><strong>Copyright &copy; - Carlos Andrés Castro Jaramillo</strong></p>
    </footer>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <!--¿Cómo esconder el "#" hash de una url-->
    <script type="text/javascript">
        window.onhashchange = function () {
            window.history.pushState('', document.title, window.location.pathname)
        }
    </script>
</body>

</html>
