<div>
    <h1 class="display-6">Algoritmo 1</h1>
    <p>Operaciones básicas con dos números (Suma, Resta, Multiplicación y División).</p>
    <div>
        <h1 class="display-6">Solución</h1>
        <section id="operaciones" class="py-5">
            <div class="card">
                <div class="card-header">
                    <h1>Operaciones</h1>
                </div>
                <div class="card-body">
                   
                        <div class="mb-3 mt-3">
                            <label for="num1" class="form-label">Número 1:</label>
                            <input type="text" class="form-control" id="num1" name="num1">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="num2" class="form-label">Número 2:</label>
                            <input type="text" class="form-control" id="num2" name="num2">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="operacion" class="form-label">Operaciones:</label>
                            <select class="form-select" name="operacion" id="operacion">
                                <option value="">Seleccione</option>
                                <option value="suma">Suma</option>
                                <option value="resta">Resta</option>
                                <option value="multi">Multiplicación</option>
                                <option value="division">División</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="button" class="btn btn-success btn-block" id="calcular" name="calcular">Calcular</button>
                            <p>Resultado</p>
                            <p id="resultado"></p>
                        </div>
                    
                </div>
            </div>
           
            <script type="text/javascript">
                document.getElementById("calcular").addEventListener('click', () =>{ 
                //Inputs
                const a = parseInt(document.getElementById("num1").value)
                const b = parseInt(document.getElementById("num2").value)
                const oper = document.getElementById("operacion").value
                //Process
               switch (oper) {
                case 'suma':
                    var suma=a+b
                    document.getElementById("resultado").innerHTML = +  suma;             
                    break;
                case 'resta':
                    var resta=a-b
                    document.getElementById("resultado").innerHTML = + resta;             
                    break;
               
                default:
                    break;
               }
                //Output
                //console.log(c);
                //window.alert(c);
                //document.write(c);
                //document.getElementById("resultado").innerHTML = "El resultado es " + c; 
            })
            </script>

        </section>
    </div>
</div>
