<!DOCTYPE html>
<html lang="es-CO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--SEO Tags-->
    <meta name="author" content="Carlos Andres Castro Jaramillo">
    <meta name="description" content="Diseño en Bootstrap 5">
    <meta name="keywords" content="diseño, DISEÑO, Diseño, bootstrap, Bootstrap, BOOTSTRAP">
    <!--Tags Optimized-->
    <meta name="theme-color" content="#0d6efd">
    <meta name="MobileOptimized" content="width">
    <meta name="HandhledFriendly" content="true">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar" content="black-traslucent">
    <!--Title and Favicon-->
    <title>Fray Julio</title>
    <link rel="shortcut icon" href="assets/media/logo.png" type="image/x-icon">
    <!--Styles Bootstrap-->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!--Icons Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Logo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar" aria-label="Boton toggle">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Carousel -->
        <div id="demo" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators/dots -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-label="Boton0"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="Boton1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="Boton2"></button>
            </div>

            <!-- The slideshow/carousel -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="assets/media/foto1.jpg" alt="Los Angeles" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="assets/media/foto2.jpg" alt="Chicago" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="assets/media/foto3.jpg" alt="New York" class="d-block w-100">
                </div>
            </div>

            <!-- Left and right controls/icons -->
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev" aria-label="Boton prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next" aria-label="Boton next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </header>

    <main>

    </main>

    <footer>

    </footer>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
